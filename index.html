<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Better Subway</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- ui.js paints into these three regions. The loading span is the
       initial visible state before the module evaluates. -->
  <header id="hud">
    <span class="loading">loading…</span>
  </header>

  <main id="app"></main>

  <!-- Kept for layout-history reasons (used to be the commuter sidebar);
       ui.js now hides it via CSS and uses a floating hover card instead. -->
  <aside id="commuters"></aside>

  <script type="module" src="./ui.js"></script>
</body>
</html>
